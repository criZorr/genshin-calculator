<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles/font.css" />
    <link class="my-styles" rel="stylesheet" href="./styles/styles.css" />
    <link class="auto-theme" rel="stylesheet" href="./styles/auto-theme.css" />
    <title>GI: Level Calculator</title>
    <meta name="darkreader-lock" />
    <meta
      name="description"
      content="This section shows you how many materials, resin and time you should spend to level up characters and weapons."
    />
    <link rel="favicon" href="https://crizorr.github.io/genshin-calculator/assets/favicon.png" />
    <link rel="icon" href="https://crizorr.github.io/genshin-calculator/assets/favicon.png" />
    <link
      rel="apple-touch-icon"
      href="https://crizorr.github.io/genshin-calculator/assets/favicon.png"
    />
    <meta name="theme-color" content="#323947" />
    <meta name="twitter:card" content="summary" />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div class="loader-container">
      <div class="loader"></div>
      <img src="./assets/favicon.svg" alt="criZorr" />
    </div>
    <header class="header">
      <nav class="head-container">
        <a class="menu-btn btn-characters" href="./index.html">
          <div class="menu-btn-img">
            <img src="./assets/characters.svg" alt="Characters section" />
          </div>
          <p>Characters</p>
        </a>
        <a class="menu-btn btn-weapons" href="./weapons.html">
          <div class="menu-btn-img">
            <img src="./assets/weapons.svg" alt="Weapons section" />
          </div>
          <p>Weapons</p>
        </a>
        <a class="menu-btn btn-personal active-page" href="./personal.html">
          <div class="menu-btn-img">
            <img src="./assets/personal.svg" alt="Personal section" />
          </div>
          <p>Personal</p> </a
        ><a class="menu-btn btn-personal" href="./settings.html">
          <div class="menu-btn-img">
            <img src="./assets/settings.svg" alt="Settings section" />
          </div>
          <p>Settings</p>
        </a>
      </nav>
    </header>
    <main class="container">
      <div class="content-parameters-user">
        <section class="card-user-info bg-snd">
          <div class="element-header">
            <h3 class="frst-text">Personal Information</h3>
          </div>
          <div class="user-info frst-text"></div>
        </section>
        <div class="user-materials-container bg-snd">
          <div class="element-header">
            <h3 class="frst-text">Owned Materials</h3>
            <section class="buttons-element">
              <button class="btn-element btn-expand-container">
                <img class="btn-expand" src="./assets/expand.svg" alt="expand Total card" />
              </button>
              <button class="btn-element btn-plus-container">
                <img class="btn-plus" src="./assets/plus.svg" alt="Add material" />
              </button>
            </section>
          </div>
          <section class="card-user-amount"></section>
        </div>
      </div>
      <div class="content-info">
        <div class="total-container">
          <section class="card-total-personal bg-snd" id="Total">
            <div class="element-header">
              <h3 class="frst-text">Remaining and Calcs</h3>
              <section class="buttons-element">
                <button class="btn-element btn-expand-container">
                  <img class="btn-expand" src="./assets/expand.svg" alt="expand Total card" />
                </button>
              </section>
            </div>
            <div class="elements-container">
              <img src="./assets/nothing.webp" alt="nothing here!" class="nothing-here" />
            </div>
          </section>
        </div>
        <div class="excess-container">
          <section class="card-total-personal bg-snd" id="Excess">
            <div class="element-header">
              <h3 class="frst-text">Nedeed and Excess</h3>
              <section class="buttons-element">
                <button class="btn-element btn-expand-container">
                  <img class="btn-expand" src="./assets/expand.svg" alt="expand Total card" />
                </button>
              </section>
            </div>
            <div class="extra-container">
              <img src="./assets/nothing.webp" alt="nothing here!" class="nothing-here" />
            </div>
          </section>
        </div>
      </div>
    </main>
    <footer class="footer bg-snd">
      <small class="frst-text">
        By <a href="https://crizorr.com" target="_blank" rel="noopener">@criZorr</a>. All game
        resources are miHoYo property.</small
      >
    </footer>
    <article class="modal-container-materials">
      <div class="modal-item-container">
        <div class="modal-item-holder bg-snd">
          <div class="filter-items frst-text">
            <input class="filter-checkbox" type="checkbox" name="exp" id="exp" />
            <label class="filter-label bg-trd" for="exp"> Exp material </label>
            <input class="filter-checkbox" type="checkbox" name="elite" id="elite" />
            <label class="filter-label bg-trd" for="elite"> Elite enemies </label>
            <input class="filter-checkbox" type="checkbox" name="common" id="common" />
            <label class="filter-label bg-trd" for="common"> Common enemies </label>
            <input class="filter-checkbox" type="checkbox" name="weekly" id="weekly" />
            <label class="filter-label bg-trd" for="weekly"> Weekly bosses </label>
            <input class="filter-checkbox" type="checkbox" name="world" id="world" />
            <label class="filter-label bg-trd" for="world"> World bosses </label>
            <input class="filter-checkbox" type="checkbox" name="stones" id="stones" />
            <label class="filter-label bg-trd" for="stones"> Stones </label>
            <input class="filter-checkbox" type="checkbox" name="talent" id="talent" />
            <label class="filter-label bg-trd" for="talent"> Talent materials </label>
            <input class="filter-checkbox" type="checkbox" name="weapon" id="weapon" />
            <label class="filter-label bg-trd" for="weapon"> Weapon Materials </label>
            <input class="filter-checkbox" type="checkbox" name="speciality" id="speciality" />
            <label class="filter-label bg-trd" for="speciality"> Specialities </label>
          </div>
          <div class="items-container-user"></div>
        </div>
      </div>
    </article>
    <article class="modal-container"></article>
    <script src="./personal.js" type="module"></script>
    <script src="./index.js"></script>
  </body>
</html>
