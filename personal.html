<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GI: Level Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link class="my-styles" rel="stylesheet" href="./styles/styles.css" />
    <meta name="darkreader-lock" />
  </head>
  <body class="bg-trd">
    <header class="header">
      <nav class="head-container">
        <a class="menu-btn btn-characters" href="./index.html">
          <div class="menu-btn-img">
            <img src="./assets/characters.svg" alt="Characters section" />
          </div>
          <p>Characters</p>
        </a>
        <a class="menu-btn btn-weapons" href="./weapons.html">
          <div class="menu-btn-img">
            <img src="./assets/weapons.svg" alt="Weapons section" />
          </div>
          <p>Weapons</p>
        </a>
        <a class="menu-btn btn-personal active-page" href="./personal.html">
          <div class="menu-btn-img">
            <img src="./assets/personal.svg" alt="Personal section" />
          </div>
          <p>Personal</p>
        </a>
      </nav>
    </header>
    <main class="container">
      <div class="content-parameters-user">
        <section class="card-user-info bg-snd">
          <div class="element-header">
            <h3 class="frst-text">Personal Information</h3>
          </div>
          <div class="user-info frst-text"></div>
        </section>
        <div class="user-materials-container bg-snd">
          <div class="element-header">
            <h3 class="frst-text">Owned Materials</h3>
            <section class="buttons-element">
              <button class="btn-element btn-expand-container">
                <img class="btn-expand" src="./assets/expand.svg" alt="expand Total card" />
              </button>
              <button class="btn-element btn-plus-container">
                <img class="btn-plus" src="./assets/plus.svg" alt="Add material" />
              </button>
            </section>
          </div>
          <section class="card-user-amount"></section>
        </div>
      </div>
      <div class="content-info">
        <div class="total-container">
          <p class="scnd-text"><b>Remaining and Calculation Results</b></p>
          <section class="card-total-personal bg-snd" id="Total">
            <div class="element-header">
              <h3 class="frst-text">Remaining and Calcs</h3>
              <section class="buttons-element">
                <button class="btn-element btn-expand-container">
                  <img class="btn-expand" src="./assets/expand.svg" alt="expand Total card" />
                </button>
              </section>
            </div>
            <div class="elements-container">
              <img src="./assets/nothing.png" alt="nothing here!" class="nothing-here" />
            </div>
          </section>
        </div>
        <div class="excess-container">
          <p class="scnd-text"><b>Needed and Excess results</b></p>
          <section class="card-total-personal bg-snd" id="Excess">
            <div class="element-header">
              <h3 class="frst-text">Nedeed and Excess</h3>
              <section class="buttons-element">
                <button class="btn-element btn-expand-container">
                  <img class="btn-expand" src="./assets/expand.svg" alt="expand Total card" />
                </button>
              </section>
            </div>
            <div class="extra-container">
              <img src="./assets/nothing.png" alt="nothing here!" class="nothing-here" />
            </div>
          </section>
        </div>
      </div>
    </main>
    <footer class="footer bg-snd">
      <small> <a href="https://crizorr.com" target="_blank" rel="noopener">@criZorr</a></small>
    </footer>
    <article class="modal-container"></article>
    <script src="./personal.js" type="module"></script>
    <script src="./index.js"></script>
  </body>
</html>
