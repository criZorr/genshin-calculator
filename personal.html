<!doctype html>
<html class="color-os" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles/font.css" />
    <link class="my-styles" rel="stylesheet" href="./styles/styles.css" />
    <title>GI: Level Calculator</title>
    <meta name="darkreader-lock" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="This section shows you how many materials, resin and time you should spend to level up characters and weapons."
    />
    <link rel="favicon" href="https://genshin.crizorr.com/assets/favicon.png" />
    <link rel="icon" href="https://genshin.crizorr.com/assets/favicon.png" />
    <link
      rel="apple-touch-icon"
      href="https://genshin.crizorr.com/assets/favicon.png"
    />
    <meta name="theme-color" content="#323947" />
    <meta name="twitter:card" content="summary" />
    <meta property="og:type" content="website" />

  <body>
    <div class="loader-container">
      <div class="loader"></div>
      <img src="./assets/favicon.svg" alt="criZorr" />
    </div>
    <header class="header">
      <nav class="head-container">
        <a class="menu-btn btn-characters" href="./index.html">
          <div class="menu-btn-img">
            <img src="./assets/characters.svg" alt="Characters section" />
          </div>
          <p class="txt-item">Characters</p>
        </a>
        <a class="menu-btn btn-weapons" href="./weapons.html">
          <div class="menu-btn-img">
            <img src="./assets/weapons.svg" alt="Weapons section" />
          </div>
          <p class="txt-item">Weapons</p>
        </a>
        <a class="menu-btn btn-personal active-page" href="./personal.html">
          <div class="menu-btn-img">
            <img src="./assets/personal.svg" alt="Personal section" />
          </div>
          <p class="txt-item">Personal</p> </a
        ><a class="menu-btn btn-personal" href="./settings.html">
          <div class="menu-btn-img">
            <img src="./assets/settings.svg" alt="Settings section" />
          </div>
          <p class="txt-item">Settings</p>
        </a>
      </nav>
    </header>
    <main class="container">
      <div class="content-parameters-user">
        <section class="card-user-info bg-snd">
          <div class="element-header">
            <h3 class="frst-text txt-item">Personal Information</h3>
          </div>
          <div class="user-info frst-text"></div>
        </section>
        <div class="user-materials-container bg-snd">
          <div class="element-header">
            <h3 class="frst-text txt-item">Owned Materials</h3>
            <section class="buttons-element">
              <button class="btn-element btn-expand-container">
                <img
                  class="btn-expand"
                  src="./assets/expand.svg"
                  alt="expand Total card"
                />
              </button>
              <button class="btn-element btn-plus-container">
                <img
                  class="btn-plus"
                  src="./assets/plus.svg"
                  alt="Add material"
                />
              </button>
            </section>
          </div>
          <div class="filter-items one-line frst-text">
            <input
              class="filter-checkbox"
              type="checkbox"
              id="exp-snd"
              data-filter-id="exp"
            />
            <label class="filter-label bg-trd txt-item-filter" for="exp-snd">
              Exp material
            </label>
            <input
              class="filter-checkbox"
              type="checkbox"
              id="elite-snd"
              data-filter-id="elite"
            />
            <label class="filter-label bg-trd txt-item-filter" for="elite-snd">
              Elite enemies
            </label>
            <input
              class="filter-checkbox"
              type="checkbox"
              id="common-snd"
              data-filter-id="common"
            />
            <label class="filter-label bg-trd txt-item-filter" for="common-snd">
              Common enemies
            </label>
            <input
              class="filter-checkbox"
              type="checkbox"
              id="weekly-snd"
              data-filter-id="weekly"
            />
            <label class="filter-label bg-trd txt-item-filter" for="weekly-snd">
              Weekly bosses
            </label>
            <input
              class="filter-checkbox"
              type="checkbox"
              id="world-snd"
              data-filter-id="world"
            />
            <label class="filter-label bg-trd txt-item-filter" for="world-snd">
              World bosses
            </label>
            <input
              class="filter-checkbox"
              type="checkbox"
              id="stones-snd"
              data-filter-id="stones"
            />
            <label class="filter-label bg-trd txt-item-filter" for="stones-snd">
              Stones
            </label>
            <input
              class="filter-checkbox"
              type="checkbox"
              id="talent-snd"
              data-filter-id="talent"
            />
            <label class="filter-label bg-trd txt-item-filter" for="talent-snd">
              Talent materials
            </label>
            <input
              class="filter-checkbox"
              type="checkbox"
              id="weapon-snd"
              data-filter-id="weapon"
            />
            <label class="filter-label bg-trd txt-item-filter" for="weapon-snd">
              Weapon Materials
            </label>
            <input
              class="filter-checkbox"
              type="checkbox"
              id="speciality-snd"
              data-filter-id="speciality"
            />
            <label
              class="filter-label bg-trd txt-item-filter"
              for="speciality-snd"
            >
              Specialties
            </label>
          </div>
          <section class="card-user-amount scroll-active"></section>
        </div>
      </div>
      <div class="content-info">
        <div class="total-container">
          <section class="card-total-personal bg-snd" id="Total">
            <div class="element-header">
              <h3 class="frst-text txt-item">Remaining and Calcs</h3>
              <section class="buttons-element">
                <button class="btn-element btn-expand-container">
                  <img
                    class="btn-expand"
                    src="./assets/expand.svg"
                    alt="expand Total card"
                  />
                </button>
              </section>
            </div>
            <div class="filter-items one-line nowrap frst-text">
              <input
                class="filter-checkbox"
                type="checkbox"
                id="exp-trd"
                data-filter-id="exp"
              />
              <label class="filter-label bg-trd txt-item-filter" for="exp-trd">
                Exp material
              </label>
              <input
                class="filter-checkbox"
                type="checkbox"
                id="elite-trd"
                data-filter-id="elite"
              />
              <label
                class="filter-label bg-trd txt-item-filter"
                for="elite-trd"
              >
                Elite enemies
              </label>
              <input
                class="filter-checkbox"
                type="checkbox"
                id="common-trd"
                data-filter-id="common"
              />
              <label
                class="filter-label bg-trd txt-item-filter"
                for="common-trd"
              >
                Common enemies
              </label>
              <input
                class="filter-checkbox"
                type="checkbox"
                id="weekly-trd"
                data-filter-id="weekly"
              />
              <label
                class="filter-label bg-trd txt-item-filter"
                for="weekly-trd"
              >
                Weekly bosses
              </label>
              <input
                class="filter-checkbox"
                type="checkbox"
                id="world-trd"
                data-filter-id="world"
              />
              <label
                class="filter-label bg-trd txt-item-filter"
                for="world-trd"
              >
                World bosses
              </label>
              <input
                class="filter-checkbox"
                type="checkbox"
                id="stones-trd"
                data-filter-id="stones"
              />
              <label
                class="filter-label bg-trd txt-item-filter"
                for="stones-trd"
              >
                Stones
              </label>
              <input
                class="filter-checkbox"
                type="checkbox"
                id="talent-trd"
                data-filter-id="talent"
              />
              <label
                class="filter-label bg-trd txt-item-filter"

              >
                Talent materials
              </label>
              <input
                class="filter-checkbox"
                type="checkbox"
                id="weapon-trd"
                data-filter-id="weapon"
              />
              <label
                class="filter-label bg-trd txt-item-filter"
                for="weapon-trd"
              >
                Weapon Materials
              </label>
              <input
                class="filter-checkbox"
                type="checkbox"
                id="speciality-trd"
                data-filter-id="speciality"
              />
              <label
                class="filter-label bg-trd txt-item-filter"
                for="speciality-trd"
              >
                Specialties
              </label>
            </div>
            <div class="elements-container scroll-active">
              <img
                src="./assets/nothing.webp"
                alt="nothing here!"
                class="nothing-here"
              />
            </div>
          </section>
        </div>
        <div class="excess-container">
          <section class="card-total-personal bg-snd" id="Excess">
            <div class="element-header">
              <h3 class="frst-text txt-item">Nedeed and Excess</h3>
              <section class="buttons-element">
                <button class="btn-element btn-expand-container">
                  <img
                    class="btn-expand"
                    src="./assets/expand.svg"
                    alt="expand Total card"
                  />
                </button>
              </section>
            </div>
            <div class="filter-items one-line nowrap frst-text">
              <input
                class="filter-checkbox"
                type="checkbox"
                id="exp-fth"
                data-filter-id="exp"
              />
              <label class="filter-label bg-trd txt-item-filter" for="exp-fth">
                Exp material
              </label>
              <input
                class="filter-checkbox"
                type="checkbox"
                id="elite-fth"
                data-filter-id="elite"
              />
              <label
                class="filter-label bg-trd txt-item-filter"
                for="elite-fth"
              >
                Elite enemies
              </label>
              <input
                class="filter-checkbox"
                type="checkbox"
                id="common-fth"
                data-filter-id="common"
              />
              <label
                class="filter-label bg-trd txt-item-filter"

              >
                Common enemies
              </label>
              <input
                class="filter-checkbox"
                type="checkbox"
                id="weekly-fth"
                data-filter-id="weekly"
              />
              <label
                class="filter-label bg-trd txt-item-filter"

              >
                Weekly bosses

              <input
                class="filter-checkbox"
                type="checkbox"
                id="world-fth"
                data-filter-id="world"
              />
              <label
                class="filter-label bg-trd txt-item-filter"
                for="world-fth"
              >
                World bosses
              </label>
              <input
                class="filter-checkbox"
                type="checkbox"
                id="stones-fth"
                data-filter-id="stones"
              />
              <label
                class="filter-label bg-trd txt-item-filter"
                for="stones-fth"
              >
                Stones
              </label>
              <input
                class="filter-checkbox"
                type="checkbox"
                id="talent-fth"
                data-filter-id="talent"
              />
              <label
                class="filter-label bg-trd txt-item-filter"
                for="talent-fth"
              >
                Talent materials
              </label>
              <input
                class="filter-checkbox"
                type="checkbox"
                id="weapon-fth"
                data-filter-id="weapon"
              />
              <label
                class="filter-label bg-trd txt-item-filter"
                for="weapon-fth"
              >
                Weapon Materials
              </label>
              <input
                class="filter-checkbox"
                type="checkbox"
                id="speciality-fth"
                data-filter-id="speciality"
              />
              <label
                class="filter-label bg-trd txt-item-filter"
                for="speciality-fth"
              >
                Specialties
              </label>
            </div>
            <div class="extra-container scroll-active">
              <img
                src="./assets/nothing.webp"
                alt="nothing here!"
                class="nothing-here"
              />
            </div>
          </section>
        </div>
      </div>
    </main>
    <article class="modal-container-materials">
      <div class="modal-item-holder bg-snd">
        <div class="filter-items frst-text">
          <input
            class="filter-checkbox"
            type="checkbox"
            id="exp"

          />
          <label class="filter-label bg-trd txt-item-filter" for="exp">

          <input

          <input

          <input

        </div>
        <div class="items-container-user scroll-active"></div>
      </div>
    </article>
    <footer class="footer bg-snd">
      <small class="frst-text txt-item">
        By
        <a href="https://crizorr.com" target="_blank" rel="noopener">@criZorr</a

      >
    </footer>
    <article class="modal-container"></article>
    <script src="./personal.js" type="module"></script>
    <script src="./index.js" type="module"></script>
  </body>
</html>
