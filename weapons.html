<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles/font.css" />
    <link class="my-styles" rel="stylesheet" href="./styles/styles.css" />
    <link class="auto-theme" rel="stylesheet" href="./styles/auto-theme.css" />
    <title>GI: Level Calculator</title>
    <meta name="darkreader-lock" />
    <meta
      name="description"
      content="This section it to know how many materials, resin and time you should spend to level up weapons."
    />
    <link rel="favicon" href="https://genshin.crizorr.com/assets/favicon.png" />
    <link rel="icon" href="https://genshin.crizorr.com/assets/favicon.png" />
    <link
      rel="apple-touch-icon"
      href="https://genshin.crizorr.com/assets/favicon.png"
    />
    <meta name="theme-color" content="#323947" />
    <meta name="twitter:card" content="summary" />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div class="loader-container">
      <div class="loader"></div>
      <img src="./assets/favicon.svg" alt="criZorr" />
    </div>
    <header class="header">
      <nav class="head-container">
        <a class="menu-btn btn-characters" href="./index.html">
          <div class="menu-btn-img">
            <img src="./assets/characters.svg" alt="Characters" />
          </div>
          <p>Characters</p>
        </a>
        <a class="menu-btn btn-weapons active-page" href="./weapons.html">
          <div class="menu-btn-img">
            <img src="./assets/weapons.svg" alt="Weapons section" />
          </div>
          <p>Weapons</p>
        </a>
        <a class="menu-btn btn-personal" href="./personal.html">
          <div class="menu-btn-img">
            <img src="./assets/personal.svg" alt="Personal section" />
          </div>
          <p>Personal</p> </a
        ><a class="menu-btn btn-personal" href="./settings.html">
          <div class="menu-btn-img">
            <img src="./assets/settings.svg" alt="Settings section" />
          </div>
          <p>Settings</p>
        </a>
      </nav>
    </header>
    <main class="container">
      <div class="content-parameters bg-snd">
        <h3 class="scnd-text">Select a Weapon</h3>
        <div class="section-weapon frst-text">
          <h5>Weapon</h5>
          <div class="filter-weapon">
            <input
              class="filter-checkbox"
              type="checkbox"
              name="bow"
              id="bow"
            />
            <label class="filter-label bg-trd" for="bow"> Bow </label>
            <input
              class="filter-checkbox"
              type="checkbox"
              name="catalyst"
              id="catalyst"
            />
            <label class="filter-label bg-trd" for="catalyst"> Catalyst </label>
            <input
              class="filter-checkbox"
              type="checkbox"
              name="claymore"
              id="claymore"
            />
            <label class="filter-label bg-trd" for="claymore"> Claymore </label>
            <input
              class="filter-checkbox"
              type="checkbox"
              name="polearm"
              id="polearm"
            />
            <label class="filter-label bg-trd" for="polearm"> Polearm </label>
            <input
              class="filter-checkbox"
              type="checkbox"
              name="sword"
              id="sword"
            />
            <label class="filter-label bg-trd" for="sword"> Sword </label>
          </div>
        </div>
        <div class="section-quality frst-text">
          <h5>Quality</h5>
          <div class="filter-quality">
            <input
              class="filter-checkbox"
              type="checkbox"
              name="5-stars"
              id="5-stars"
            />
            <label class="filter-label bg-trd" for="5-stars"> 5 stars </label>
            <input
              class="filter-checkbox"
              type="checkbox"
              name="4-stars"
              id="4-stars"
            />
            <label class="filter-label bg-trd" for="4-stars"> 4 stars </label>
            <input
              class="filter-checkbox"
              type="checkbox"
              name="3-stars"
              id="3-stars"
            />
            <label class="filter-label bg-trd" for="3-stars"> 3 stars </label>
            <input
              class="filter-checkbox"
              type="checkbox"
              name="2-stars"
              id="2-stars"
            />
            <label class="filter-label bg-trd" for="2-stars"> 2 stars </label>
            <input
              class="filter-checkbox"
              type="checkbox"
              name="1-stars"
              id="1-stars"
            />
            <label class="filter-label bg-trd" for="1-stars"> 1 stars </label>
          </div>
        </div>
        <div class="section-items">
          <section class="cards-container"></section>
          <section class="gradiant-left"></section>
          <section class="gradiant-right"></section>
        </div>
      </div>
      <div class="content-info">
        <div class="content-selected">
          <p class="scnd-text"><b>Selected Weapons</b></p>
          <div class="selected-container">
            <select class="selected-items bg-snd frst-text">
              <option>Select a weapon...</option>
            </select>
            <div class="container-selected-icon">
              <div class="selected-items-icon"></div>
            </div>
          </div>
        </div>
        <div class="items-container">
          <div class="total-container">
            <section class="card-total bg-snd" id="Total">
              <div class="element-header">
                <h3 class="frst-text">Remaining and Calcs</h3>
                <section class="buttons-element">
                  <button class="btn-element btn-expand-container">
                    <img
                      class="btn-expand"
                      src="./assets/expand.svg"
                      alt="expand Total card"
                    />
                  </button>
                </section>
              </div>
              <div class="elements-container">
                <img
                  src="./assets/nothing.webp"
                  alt="nothing here!"
                  class="nothing-here"
                />
              </div>
            </section>
          </div>
          <div class="excess-container">
            <section class="card-total bg-snd" id="Excess">
              <div class="element-header">
                <h3 class="frst-text">Nedeed and Excess</h3>
                <section class="buttons-element">
                  <button class="btn-element btn-expand-container">
                    <img
                      class="btn-expand"
                      src="./assets/expand.svg"
                      alt="expand Total card"
                    />
                  </button>
                </section>
              </div>
              <div class="extra-container">
                <img
                  src="./assets/nothing.webp"
                  alt="nothing here!"
                  class="nothing-here"
                />
              </div>
            </section>
          </div>
          <div>
            <p class="scnd-text"><b>Individual calculation results</b></p>
            <div class="card-individual-container"></div>
          </div>
        </div>
      </div>
    </main>
    <article class="modal-container"></article>
    <footer class="footer bg-snd">
      <small class="frst-text">
        By
        <a href="https://crizorr.com" target="_blank" rel="noopener">@criZorr</a
        >. All game resources are miHoYo property.</small
      >
    </footer>
    <script src="./weapons.js" type="module"></script>
    <script src="./index.js"></script>
  </body>
</html>
