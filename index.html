<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GI: Level Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link class="my-styles" rel="stylesheet" href="./styles/styles.css" />
    <meta name="darkreader-lock" />
  </head>
  <body class="bg-trd">
    <header class="header">
      <nav class="head-container">
        <a class="menu-btn btn-characters active-page" href="./index.html">
          <div class="menu-btn-img">
            <img src="./assets/characters.svg" alt="Characters section" />
          </div>
          <p>Characters</p>
        </a>
        <a class="menu-btn btn-weapons" href="./weapons.html">
          <div class="menu-btn-img">
            <img src="./assets/weapons.svg" alt="Weapons section" />
          </div>
          <p>Weapons</p>
        </a>
        <a class="menu-btn btn-personal" href="./personal.html">
          <div class="menu-btn-img">
            <img src="./assets/personal.svg" alt="Personal section" />
          </div>
          <p>Personal</p>
        </a>
      </nav>
    </header>
    <main class="container">
      <div class="content-parameters bg-snd">
        <h3 class="scnd-text">Select character</h3>
        <div class="section-element frst-text">
          <h5>Element</h5>
          <div class="filter-element">
            <input class="filter-checkbox" type="checkbox" name="anemo" id="anemo" />
            <label class="filter-label bg-trd" for="anemo"> Anemo </label>
            <input class="filter-checkbox" type="checkbox" name="cryo" id="cryo" />
            <label class="filter-label bg-trd" for="cryo"> Cryo </label>
            <input class="filter-checkbox" type="checkbox" name="dendro" id="dendro" />
            <label class="filter-label bg-trd" for="dendro"> Dendro </label>
            <input class="filter-checkbox" type="checkbox" name="electro" id="electro" />
            <label class="filter-label bg-trd" for="electro"> Electro </label>
            <input class="filter-checkbox" type="checkbox" name="geo" id="geo" />
            <label class="filter-label bg-trd" for="geo"> Geo </label>
            <input class="filter-checkbox" type="checkbox" name="hydro" id="hydro" />
            <label class="filter-label bg-trd" for="hydro"> Hydro </label>
            <input class="filter-checkbox" type="checkbox" name="pyro" id="pyro" />
            <label class="filter-label bg-trd" for="pyro"> Pyro </label>
          </div>
        </div>
        <div class="section-weapon frst-text">
          <h5>Weapon</h5>
          <div class="filter-weapon">
            <input class="filter-checkbox" type="checkbox" name="bow" id="bow" />
            <label class="filter-label bg-trd" for="bow"> Bow </label>
            <input class="filter-checkbox" type="checkbox" name="catalyst" id="catalyst" />
            <label class="filter-label bg-trd" for="catalyst"> Catalyst </label>
            <input class="filter-checkbox" type="checkbox" name="claymore" id="claymore" />
            <label class="filter-label bg-trd" for="claymore"> Claymore </label>
            <input class="filter-checkbox" type="checkbox" name="polearm" id="polearm" />
            <label class="filter-label bg-trd" for="polearm"> Polearm </label>
            <input class="filter-checkbox" type="checkbox" name="sword" id="sword" />
            <label class="filter-label bg-trd" for="sword"> Sword </label>
          </div>
        </div>
        <div class="section-quality frst-text">
          <h5>Quality</h5>
          <div class="filter-quality">
            <input class="filter-checkbox" type="checkbox" name="5-stars" id="5-stars" />
            <label class="filter-label bg-trd" for="5-stars"> 5 stars </label>
            <input class="filter-checkbox" type="checkbox" name="4-stars" id="4-stars" />
            <label class="filter-label bg-trd" for="4-stars"> 4 stars </label>
          </div>
        </div>
        <div class="section-items">
          <section class="cards-container"></section>
          <section class="gradiant-left"></section>
          <section class="gradiant-right"></section>
        </div>
      </div>
      <div class="content-info">
        <div class="content-selected">
          <p class="scnd-text"><b>Selected characters</b></p>
          <div class="selected-container">
            <select class="selected-items bg-snd frst-text">
              <option>Select a character...</option>
            </select>
            <div class="container-selected-icon">
              <div class="selected-items-icon"></div>
            </div>
          </div>
        </div>
        <div class="items-container">
          <div class="total-container"></div>
          <div>
            <p class="scnd-text"><b>Individual calculation results</b></p>
            <div class="card-individual-container"></div>
          </div>
        </div>
      </div>
    </main>
    <footer class="footer bg-snd">
      <small> <a href="https://crizorr.com" target="_blank" rel="noopener">@criZorr</a></small>
    </footer>
    <article class="modal-container"></article>
    <script src="./characters.js" type="module"></script>
    <script src="./index.js"></script>
  </body>
</html>
