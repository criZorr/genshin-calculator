<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles/font.css" />
    <link class="my-styles" rel="stylesheet" href="./styles/styles.css" />
    <title>GI: Level Calculator</title>
    <meta name="darkreader-lock" />
    <meta
      name="description"
      content="This section shows you diferent settings to interact with the page."
    />
    <link rel="favicon" href="https://crizorr.github.io/genshin-calculator/assets/favicon.png" />
    <link rel="icon" href="https://crizorr.github.io/genshin-calculator/assets/favicon.png" />
    <link
      rel="apple-touch-icon"
      href="https://crizorr.github.io/genshin-calculator/assets/favicon.png"
    />
    <meta name="theme-color" content="#323947" />
    <meta name="twitter:card" content="summary" />
    <meta property="og:type" content="website" />
  </head>
  <body class="bg-trd">
    <header class="header">
      <nav class="head-container">
        <a class="menu-btn btn-characters" href="./index.html">
          <div class="menu-btn-img">
            <img src="./assets/characters.svg" alt="Characters section" />
          </div>
          <p>Characters</p>
        </a>
        <a class="menu-btn btn-weapons" href="./weapons.html">
          <div class="menu-btn-img">
            <img src="./assets/weapons.svg" alt="Weapons section" />
          </div>
          <p>Weapons</p>
        </a>
        <a class="menu-btn btn-personal" href="./personal.html">
          <div class="menu-btn-img">
            <img src="./assets/personal.svg" alt="Personal section" />
          </div>
          <p>Personal</p>
        </a>
        <a class="menu-btn btn-personal active-page" href="./settings.html">
          <div class="menu-btn-img">
            <img src="./assets/settings.svg" alt="Settings section" />
          </div>
          <p>Settings</p>
        </a>
      </nav>
    </header>
    <main class="container">
      <div class="content-settings">
        <section class="card-simple bg-snd">
          <div class="element-header">
            <h3 class="frst-text">Export & Import Data</h3>
          </div>
          <div class="frst-text">
            <div class="simple-form">
              <div class="btn-modal">
                <button class="btn-bordered" id="import-btn">Import</button>
              </div>
              <div class="btn-modal">
                <button class="btn bg-snd-dark" id="export-btn">Export</button>
              </div>
              <input type="file" id="import" class="file-input" accept=".json" />
            </div>
          </div>
        </section>
        <section class="card-simple bg-snd">
          <div class="element-header">
            <h3 class="frst-text">Theme</h3>
          </div>
          <div class="simple-container frst-text">
            <div class="simple-form">
              <div class="custom-checkbox">
                <label class="scnd-text" for="radio-light">Light</label>
                <input type="radio" name="radio-theme" id="radio-light" />
                <span class="custom-radio-btn bg-snd">
                  <div></div>
                </span>
              </div>
              <div class="custom-checkbox">
                <label class="scnd-text" for="radio-auto">Auto</label>
                <input type="radio" name="radio-theme" id="radio-auto" />
                <span class="custom-radio-btn bg-snd">
                  <div></div>
                </span>
              </div>
              <div class="custom-checkbox">
                <label class="scnd-text" for="radio-dark">Dark</label>
                <input type="radio" name="radio-theme" id="radio-dark" />
                <span class="custom-radio-btn bg-snd">
                  <div></div>
                </span>
              </div>
            </div>
          </div>
        </section>
      </div>
    </main>
    <footer class="footer bg-snd">
      <small class="frst-text">
        By <a href="https://crizorr.com" target="_blank" rel="noopener">@criZorr</a>. All game
        resources are miHoYo property.</small
      >
    </footer>
    <script src="./settings.js"></script>
    <script src="./index.js"></script>
  </body>
</html>
